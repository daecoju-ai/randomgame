name: Learning bank validation
on:
  push:
    branches: [main]
    paths:
      - 'public/learning-data/**'
      - 'scripts/validate-learning-bank.cjs'
      - 'package.json'
      - '.github/workflows/learning-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run strict learning bank validation
        run: LEARNING_VALIDATION_STRICT=1 node scripts/validate-learning-bank.cjs
      - name: Print diagnostic report\n        if: always()\n        run: |\n          echo '--- learning validation report ---'\n          cat public/learning-validation-report.json || true\n      - name: Upload diagnostic report\n        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-validation-report
          path: public/learning-validation-report.json
          if-no-files-found: warn

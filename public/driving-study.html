<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>시티 드라이빙 · 공부하면서 레벨업 행운디펜스</title><link rel="stylesheet" href="/driving-study.css"><link rel="stylesheet" href="/refinement.css" /><link rel="stylesheet" href="/viewport.css"></head><body><main id="driveGame"><canvas id="road" aria-label="아래에서 위로 진행하는 도시 드라이빙"></canvas><header><button id="driveBack">← 학습 메뉴</button><div><small>CITY CRUISE</small><b>시티 드라이빙</b></div><button id="drivePause" aria-label="주행 일시정지">Ⅱ</button></header><div id="driveStats"><span>점수 <b id="score">0</b></span><span>충돌 <b id="hits">0</b>/5</span><span><b id="time">90</b>초</span></div><div id="roadNotice" role="status">엑셀을 눌러 출발하세요 · 진행 방향 ↑</div><div id="speedometer"><b id="speed">0</b><small>km/h</small></div><div id="indicators"><button id="indicatorLeft" aria-label="왼쪽 방향지시등">◀ 방향등</button><button id="indicatorRight" aria-label="오른쪽 방향지시등">방향등 ▶</button></div><nav id="controls" aria-label="주행 조작"><button data-k="left" aria-label="왼쪽 조향">◀</button><button data-k="right" aria-label="오른쪽 조향">▶</button><button data-k="brake" class="brake">브레이크</button><button data-k="gas" class="gas">엑셀</button></nav><section id="finish" hidden><small>DRIVE COMPLETE</small><h1>주행 완료</h1><p id="result"></p><button id="driveRetry">다시 달리기</button><button id="driveHome">학습 메뉴</button></section></main><script src="/driving-study.js"></script><script src="/wellbeing.js"></script><script src="/viewport.js"></script></body></html>

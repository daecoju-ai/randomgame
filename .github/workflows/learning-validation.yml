name: Learning bank validation
on:
  push:
    branches: [main]
    paths:
      - 'data/questions/**'
      - 'data/curriculum/**'
      - 'scripts/validate_questions.py'
      - 'data/curriculum-placement-v63.json'
      - 'public/learning-data/**'
      - 'public/learning.js'
      - 'public/account.js'
      - 'public/learning-rules.js'
      - 'public/learning-support.js'
      - 'api/learning.js'
      - 'lib/learning-bank.cjs'
      - 'tests/**'
      - 'scripts/validate-learning-bank.cjs'
      - 'scripts/audit-elementary-curriculum.cjs'
      - 'scripts/audit-learning-ambiguity.cjs'
      - 'scripts/audit-learning-curriculum-evidence.cjs'
      - 'package.json'
      - '.github/workflows/learning-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check learning JavaScript syntax
        run: node --check public/account.js && node --check public/learning.js && node --check public/learning-rules.js && node --check public/learning-support.js && node --check api/learning.js && node --check lib/learning-bank.cjs
      - name: Rebuild learning packs from source questions
        run: npm run build
      - name: Run learning tests
        run: node --test tests/learning*.test.cjs
      - name: Run strict learning bank validation
        run: LEARNING_VALIDATION_STRICT=1 node scripts/validate-learning-bank.cjs
      - name: Print diagnostic report
        if: always()
        run: |
          echo '--- learning validation report ---'
          cat public/learning-validation-report.json || true
      - name: Audit question ambiguity and publication safety
        run: node scripts/audit-learning-ambiguity.cjs
      - name: Upload ambiguity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-ambiguity-audit
          path: public/learning-ambiguity-report.json
          if-no-files-found: warn
      - name: Audit question curriculum evidence
        run: node scripts/audit-learning-curriculum-evidence.cjs
      - name: Upload curriculum evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-curriculum-evidence
          path: public/learning-curriculum-evidence-report.json
          if-no-files-found: warn
      - name: Audit elementary curriculum mapping
        run: node scripts/audit-elementary-curriculum.cjs
      - name: Upload curriculum mapping audit
        uses: actions/upload-artifact@v4
        with:
          name: elementary-curriculum-audit
          path: public/learning-curriculum-audit.json
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-validation-report
          path: public/learning-validation-report.json
          if-no-files-found: warn
